spring.application.name=webMarketar
server.port=8080
# Base de datos local. Si tu contrasena de PostgreSQL no es "postgres",
# define DB_PASSWORD en IntelliJ (Run > Edit Configurations > Environment variables).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_marketar1}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#No envia todo el trace al usuario
server.error.include-stacktrace=never
logging.level.root=INFO
logging.level.com.upc.webmarketar=${MARKETAR_LOG_LEVEL:INFO}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
marketar.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5500}

# Clave JWT (HS256 exige minimo 32 bytes). El valor por defecto es SOLO para desarrollo local;
# en produccion (perfil aws) JWT_SECRET es obligatorio.
marketar.jwt.secret=${JWT_SECRET:clave-local-de-desarrollo-marketar-no-usar-en-produccion-2026}
marketar.jwt.minutes=60

# ===================== Imagenes =====================
# Donde se guardan las imagenes: "local" (disco) por ahora. Al migrar a AWS se cambia a "s3"
# (ver application-aws.properties y StorageService).
marketar.storage.type=${MARKETAR_STORAGE_TYPE:local}
# Carpeta local (relativa a la carpeta del proyecto). Se sirven en http://localhost:8080/media/products/...
marketar.storage=${MEDIA_DIR:${MARKETAR_STORAGE:media}}

# Limite de peso: 5 MB por imagen y hasta 10 imagenes por producto
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB

# Generacion de imagenes con IA (opcional): sin estas variables la app arranca igual
marketar.ai.account-id=${CLOUDFLARE_ACCOUNT_ID:}
marketar.ai.token=${CLOUDFLARE_API_TOKEN:}
marketar.ai.model=${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}
marketar.ai.steps=${CLOUDFLARE_IMAGE_STEPS:4}
