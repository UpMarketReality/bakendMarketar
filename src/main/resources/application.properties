spring.application.name=webMarketar
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/db_marketar1
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#No envia todo el trace al usuario
server.error.include-stacktrace=never
logging.level.root=INFO
logging.level.com.upc.webproveedores=DEBUG

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
marketar.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5500}

marketar.jwt.secret=${JWT_SECRET}
marketar.jwt.minutes=60
marketar.storage=${MARKETAR_STORAGE:uploads}



